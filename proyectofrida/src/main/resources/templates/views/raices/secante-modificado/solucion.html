<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout('Solución de la Secante Modificado', ~{::section})}">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <section>
        <div class="container mt-4">
            <h2 class="mb-4">Resultado del Método de la Secante Modificado</h2>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-bordered table-striped text-center">
                        <thead class="table-dark">
                            <tr>
                                <th>Iteración</th>
                                <th>XI</th>
                                <th>Delta * XI</th>
                                <th>FXI</th>
                                <th>F(XI + Delta*XI)</th>
                                <th>XI Siguiente</th>
                                <th>Error relativo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${resultados}">
                                <td th:text="${row.iteracion}">1</td>
                                <td th:text="${#numbers.formatDecimal(row.xi, 1, 4)}">0.0</td>
                                <td th:text="${#numbers.formatDecimal(row.deltaXi, 1, 4)}">0.0</td>
                                <td th:text="${#numbers.formatDecimal(row.fxi, 1, 4)}">0.0</td>
                                <td th:text="${#numbers.formatDecimal(row.fxiDelta, 1, 4)}">0.0</td>
                                <td th:text="${#numbers.formatDecimal(row.xiSiguiente, 1, 4)}">0.0</td>
                                <td th:text="${row.iteracion == 1 ? '100.00%' : #numbers.formatDecimal(row.er, 1, 2) + '%'}">100%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white d-flex justify-content-end">
                    <a th:href="@{/raices}" class="btn btn-secondary">Regresar</a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
