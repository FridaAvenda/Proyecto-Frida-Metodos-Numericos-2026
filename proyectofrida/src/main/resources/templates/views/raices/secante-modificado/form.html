<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: layout('Método de la Secante Modificado', ~{::section})}">
<head>
    <title>Método de la Secante Modificado</title>
</head>
<body>
    <section>
        <div class="container mt-5">
            <h2>Método de la Secante Modificado</h2>

            <form th:action="@{/raices/secante-modificado}" th:object="${secanteModificado}" method="post" class="card p-4 shadow-sm">

                <div class="mb-3">
                    <label for="xi" class="form-label">Valor inicial XI</label>
                    <input type="number" step="any" class="form-control" id="xi" th:field="*{xi}" required>
                </div>

                <div class="mb-3">
                    <label for="delta" class="form-label">Perturbación (Delta)</label>
                    <input type="number" step="any" class="form-control" id="delta" th:field="*{delta}" required>
                </div>

                <div class="mb-3">
                    <label for="fx" class="form-label">Función FX</label>
                    <input type="text" class="form-control" id="fx" th:field="*{fx}" pattern="[a-zA-Z0-9\+\-\*\/\^\(\)\.\s]+" title="Solo se permiten caracteres alfanuméricos y operadores matemáticos" required>
                </div>

                <div class="mb-3">
                    <label for="er" class="form-label">Error relativo aprox.</label>
                    <input type="number" step="any" class="form-control" id="er" th:field="*{er}" required>
                </div>

                <div class="mb-4">
                    <label for="maximoIteraciones" class="form-label">Máximo de iteraciones</label>
                    <input type="number" class="form-control" id="maximoIteraciones" th:field="*{maximoIteraciones}" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Resolver</button>
                    <a th:href="@{/raices}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
